name = "Create for Horizon"
summary = "Build rotating machines and small factories in Horizon with gears, belts, presses and fans."
authors = ["Delete228"]
license = "MIT"
description = """
Create for Horizon is an experimental Rust port of [Create](https://github.com/Creators-of-Create/Create). Run belts, presses and mixers from a water wheel, build a Precision Mechanism line with Deployers, or attach a saw and a chest to a rotating tree farm.

Install it as a native mod in Horizon Launcher and build the instance. The mod comes with its own models and pixel textures.

**The original models and textures require the original Create 6.0.10 JAR for Minecraft 1.21.1 (NeoForge).** Place one copy in the instance's `horizon-mods/create-resources/` folder and restart Horizon. The JAR is optional and resources are imported locally. [Supported JAR](https://modrinth.com/mod/create/version/UjX6dr61)

The port covers a subset of Create. [Setup and compatibility](https://github.com/Delete228/create-horizon)
"""
