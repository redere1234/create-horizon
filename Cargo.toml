[package]
name = "create-horizon-core"
version = "0.11.1"
edition = "2024"
license = "MIT"
publish = false
description = "Experimental Create foundation: kinetics, pressing and item interactions"

[lib]
path = "mixins/create/engine/src/lib.rs"

[dependencies]
create-schematics = { path = "mixins/create/schematics" }

[dev-dependencies]
serde_json = "1"

[[example]]
name = "factory"
path = "examples/factory.rs"

[workspace]
members = ["mixins/create/assets", "mixins/create/schematics"]
exclude = ["mixins/create/engine", ".local", ".tools"]

[lints.rust]
unsafe_code = "forbid"
